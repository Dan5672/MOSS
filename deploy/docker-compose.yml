# MOSS stack. With HTTPS on (the "https" profile, which deploy/init.sh switches on for new installs), open
# https://<this host>; other devices use that too. Without it, the web UI is http://localhost:3000 only.
name: moss

services:
  postgres:
    image: pgvector/pgvector:pg17@sha256:ac08538c6f8b9904c33c8224c5e5706dbe760aca29db1d096972b4052c22a75d
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-moss}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-moss}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks: [backend]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-moss} -d ${POSTGRES_DB:-moss}"]
      interval: 5s
      timeout: 3s
      retries: 20

  # One-shot: applies database migrations, then exits.
  migrate:
    image: moss-gate:${MOSS_VERSION:-dev}
    build: { context: .., dockerfile: deploy/docker/gate.Dockerfile }
    command: ["node", "node_modules/@moss/db/dist/migrate.js"]
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-moss}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-moss}
      # Creates each service's own role (see packages/db/src/roles.ts) after the migrations.
      MOSS_DB_PASSWORD_GATE: ${MOSS_DB_PASSWORD_GATE:?run deploy/init.sh}
      MOSS_DB_PASSWORD_WEB: ${MOSS_DB_PASSWORD_WEB:?run deploy/init.sh}
      MOSS_DB_PASSWORD_WORKER: ${MOSS_DB_PASSWORD_WORKER:?run deploy/init.sh}
      MOSS_DB_PASSWORD_BRIDGE: ${MOSS_DB_PASSWORD_BRIDGE:?run deploy/init.sh}
      MOSS_DB_PASSWORD_BACKUP: ${MOSS_DB_PASSWORD_BACKUP:?run deploy/init.sh}
      MOSS_DB_PASSWORD_QUEUE: ${MOSS_DB_PASSWORD_QUEUE:?run deploy/init.sh}
    networks: [backend]
    depends_on:
      postgres: { condition: service_healthy }

  # Policy gate + secrets broker. The only service that holds the master key and
  # the only service that can reach the toolbox.
  gate:
    image: moss-gate:${MOSS_VERSION:-dev}
    build: { context: .., dockerfile: deploy/docker/gate.Dockerfile }
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://moss_gate:${MOSS_DB_PASSWORD_GATE:?run deploy/init.sh}@postgres:5432/${POSTGRES_DB:-moss}
      MOSS_MASTER_KEY_FILE: /run/secrets/master_key
      GATE_TOKEN_FILE: /run/secrets/gate_token
      LLM_TOKEN_FILE: /run/secrets/llm_token
      TOOLBOX_TOKEN_FILE: /run/secrets/toolbox_token
      TOOLBOX_URL: http://toolbox:7070
      WEB_TOKEN_FILE: /run/secrets/web_token
      # The chat bridge fetches the Telegram and Discord bot tokens with its own token.
      BRIDGE_TOKEN_FILE: /run/secrets/bridge_token
    secrets: [master_key, gate_token, llm_token, toolbox_token, web_token, bridge_token]
    networks: [backend, tools]
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    depends_on:
      migrate: { condition: service_completed_successfully }
      toolbox: { condition: service_started }

  # Agent runtime + scheduler. Holds no stored credentials (only its own service tokens): LLM calls go through the gate's proxy,
  # which injects provider API keys, and tool calls go through the gate's policy checks.
  worker:
    image: moss-worker:${MOSS_VERSION:-dev}
    build: { context: .., dockerfile: deploy/docker/worker.Dockerfile }
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://moss_worker:${MOSS_DB_PASSWORD_WORKER:?run deploy/init.sh}@postgres:5432/${POSTGRES_DB:-moss}
      QUEUE_DATABASE_URL: postgres://moss_queue:${MOSS_DB_PASSWORD_QUEUE:?run deploy/init.sh}@postgres:5432/${POSTGRES_DB:-moss}
      GATE_URL: http://gate:7080
      GATE_TOKEN_FILE: /run/secrets/gate_token
      # LLM calls, and what the Claude Code CLI holds: the LLM proxy only.
      LLM_TOKEN_FILE: /run/secrets/llm_token
      # Starts scheduled MOSS backups (Settings → Backups) on the backup service.
      BACKUP_URL: http://backup:7090
      # Can only start a backup; listing, deleting and downloading need the web app's token.
      BACKUP_TOKEN_FILE: /run/secrets/backup_run_token
      TZ: ${TZ:-UTC}
    secrets: [gate_token, llm_token, backup_run_token]
    networks: [backend]
    read_only: true
    tmpfs: [/tmp] # scratch home for Claude Code runs
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    depends_on:
      migrate: { condition: service_completed_successfully }
      gate: { condition: service_started }

  # Web UI and server actions. Talks to the database and, to write secrets, to the gate's
  # write-only secrets API. Holds no master key.
  web:
    image: moss-web:${MOSS_VERSION:-dev}
    build: { context: .., dockerfile: deploy/docker/web.Dockerfile, args: { MOSS_RELEASE: "${MOSS_RELEASE:-dev}" } }
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://moss_web:${MOSS_DB_PASSWORD_WEB:?run deploy/init.sh}@postgres:5432/${POSTGRES_DB:-moss}
      QUEUE_DATABASE_URL: postgres://moss_queue:${MOSS_DB_PASSWORD_QUEUE:?run deploy/init.sh}@postgres:5432/${POSTGRES_DB:-moss}
      GATE_URL: http://gate:7080
      WEB_TOKEN_FILE: /run/secrets/web_token
      MOSS_APP_KEY_FILE: /run/secrets/app_key
      # Needed once, to create the first account (printed by init.sh).
      MOSS_SETUP_CODE_FILE: /run/secrets/setup_code
      # MOSS backups (Settings → Backups): start, list, delete, and download encrypted.
      BACKUP_URL: http://backup:7090
      BACKUP_TOKEN_FILE: /run/secrets/backup_token
      # What the log collector (vector) signs in with, and the port devices send syslog to (shown on Monitoring → Logs).
      SYSLOG_TOKEN_FILE: /run/secrets/syslog_token
      MOSS_SYSLOG_PORT: ${MOSS_SYSLOG_PORT:-514}
      # false: no backup downloads from Settings (docs/hardening.md); the backup service refuses them too.
      MOSS_BACKUP_DOWNLOADS: ${MOSS_BACKUP_DOWNLOADS:-true}
      # The addresses people open MOSS at, comma-separated (docs/hardening.md). Empty: taken from each request.
      MOSS_PUBLIC_URL: ${MOSS_PUBLIC_URL:-}
      MOSS_SECURE_COOKIES: ${MOSS_SECURE_COOKIES:-false}
      # HTTPS mode (empty when off), so Settings can show how to trust MOSS's certificate or upload one.
      MOSS_TLS: ${MOSS_TLS:-}
      MOSS_HTTPS_HOSTS: ${MOSS_HTTPS_HOSTS:-}
      # Same zone as the worker, which runs agent schedules in it, so times on screen match.
      TZ: ${TZ:-UTC}
    secrets: [web_token, app_key, backup_token, setup_code, syslog_token]
    volumes:
      # Settings → HTTPS writes an uploaded certificate here for the https service, and reloads it through
      # the admin socket there with the HTTPS config (read-only).
      - tls:/tls
      - ./https:/caddy:ro
    ports:
      - "${MOSS_WEB_BIND:-127.0.0.1}:3000:3000"
    # syslog: only so the log collector (vector) can post to it (internal: no route out).
    networks: [backend, syslog]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    depends_on:
      migrate: { condition: service_completed_successfully }
      gate: { condition: service_started }

  # Runs nmap/arp-scan/ping for the gate. Non-root; only the scanner binaries hold raw-socket caps.
  # ARP discovery only sees networks the container is attached to; host networking for LANs is planned.
  toolbox:
    image: moss-toolbox:${MOSS_VERSION:-dev}
    build: { context: .., dockerfile: deploy/docker/toolbox.Dockerfile }
    restart: unless-stopped
    environment:
      TOOLBOX_TOKEN_FILE: /run/secrets/toolbox_token
      # false: the toolbox can only reach private addresses (docs/hardening.md). Cloud integrations and monitors of
      # internet addresses stop working.
      MOSS_TOOLBOX_INTERNET: ${MOSS_TOOLBOX_INTERNET:-true}
      # Your own certificate authority for devices (optional, deploy/device-ca/ca.pem): trusted for device
      # connections when certificates are checked, never for cloud or sign-in traffic.
      MOSS_DEVICE_CA_FILE: /device-ca/ca.pem
    volumes:
      - ./device-ca:/device-ca:ro
    secrets: [toolbox_token]
    networks: [tools, egress]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    # NET_RAW and NET_ADMIN for the scanners (file capabilities on nmap and arp-scan) and the optional firewall;
    # SETUID and SETGID only so toolbox-start.sh can drop from root to node. The service runs with no capabilities.
    cap_add: [NET_RAW, NET_ADMIN, SETUID, SETGID]

  # Telegram and Discord: the bots people link their chat accounts to, for alerts, approvals and chatting with
  # agents. The only service that talks to those apps (on the egress network); it gets the bot tokens from the
  # gate, which decrypts them only while their integration is on. Does nothing until one is set up.
  bridge:
    image: moss-bridge:${MOSS_VERSION:-dev}
    build: { context: .., dockerfile: deploy/docker/bridge.Dockerfile }
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://moss_bridge:${MOSS_DB_PASSWORD_BRIDGE:?run deploy/init.sh}@postgres:5432/${POSTGRES_DB:-moss}
      QUEUE_DATABASE_URL: postgres://moss_queue:${MOSS_DB_PASSWORD_QUEUE:?run deploy/init.sh}@postgres:5432/${POSTGRES_DB:-moss}
      GATE_URL: http://gate:7080
      BRIDGE_TOKEN_FILE: /run/secrets/bridge_token
      TZ: ${TZ:-UTC}
    secrets: [bridge_token]
    networks: [backend, egress]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    depends_on:
      migrate: { condition: service_completed_successfully }
      gate: { condition: service_started }

  # Reach MOSS from anywhere over Tailscale, with a real certificate and no open ports: it joins your tailnet as
  # "moss" (MOSS_TAILSCALE_HOSTNAME) and serves https://moss.<tailnet>.ts.net. Enable with the tailscale profile
  # (COMPOSE_PROFILES=https,tailscale) and an auth key in MOSS_TAILSCALE_AUTHKEY.
  tailscale:
    image: tailscale/tailscale:stable@sha256:c507f3a2a6ab1cabd8d809b98edeb41edbd5c3fb6ad9632ffd098b4c7d0b4065
    profiles: [tailscale]
    restart: unless-stopped
    hostname: ${MOSS_TAILSCALE_HOSTNAME:-moss}
    environment:
      TS_AUTHKEY: ${MOSS_TAILSCALE_AUTHKEY:-}
      TS_HOSTNAME: ${MOSS_TAILSCALE_HOSTNAME:-moss}
      TS_STATE_DIR: /var/lib/tailscale
      TS_SERVE_CONFIG: /config/serve.json
      TS_USERSPACE: "true"
    volumes:
      - tailscale_state:/var/lib/tailscale
      - ./tailscale:/config:ro
    networks: [backend, egress]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    depends_on: [web]

  # Syslog from your devices, so agents can read what a device logged without a credential for it. Always running,
  # so switching Device logs on (Monitoring → Logs) is the whole setup; while it's off, web refuses what it posts.
  # Listens on port 514 (UDP and TCP) of this host: the one port MOSS opens to the LAN (MOSS_SYSLOG_PORT moves it).
  # Reaches the web app directly on the internal syslog network; no database, no secret but the syslog token.
  # syslog_in only carries the published port (an internal network can't publish one); nothing else is on it, but
  # it's a normal bridge, so Vector itself could reach the internet. Its config sends only to web; it's pinned by digest.
  vector:
    image: timberio/vector:0.59.0-distroless-static@sha256:2138c72ef15477d3a60126da851407a198ec61d2ff4cd600a4e69db5f6a29ff7
    restart: unless-stopped
    command: ["--config", "/etc/vector/vector.yaml"]
    # Read by vector.yaml's secret backend (the files in /run/secrets), not the environment.
    secrets: [syslog_token]
    volumes:
      - ./vector:/etc/vector:ro
    ports:
      - "${MOSS_SYSLOG_BIND:-0.0.0.0}:${MOSS_SYSLOG_PORT:-514}:5514/udp"
      - "${MOSS_SYSLOG_BIND:-0.0.0.0}:${MOSS_SYSLOG_PORT:-514}:5514/tcp"
    networks: [syslog, syslog_in]
    read_only: true
    # The same user as MOSS's own services, so it can read the syslog token (mode 600, owned by the deploy user).
    user: "1000:1000"
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    depends_on: [web]

  # MOSS backups from the web: the same archives as deploy/backup.sh, into deploy/backups. It reads the
  # secrets and .env (to put them in the archive) and hands archives out only encrypted with a passphrase.
  # Root inside the container, with just the capabilities to read those files and give archives to the
  # backups folder's owner; reachable only by the web app (backup token) and the worker (run token: start a backup, nothing else).
  backup:
    image: moss-backup:${MOSS_VERSION:-dev}
    build:
      context: ..
      dockerfile: deploy/docker/backup.Dockerfile
      args: { MOSS_RELEASE: "${MOSS_RELEASE:-dev}", MOSS_COMMIT: "${MOSS_COMMIT:-unknown}" }
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://moss_backup:${MOSS_DB_PASSWORD_BACKUP:?run deploy/init.sh}@postgres:5432/${POSTGRES_DB:-moss}
      BACKUP_TOKEN_FILE: /run/secrets/backup_token
      BACKUP_RUN_TOKEN_FILE: /run/secrets/backup_run_token
      MOSS_BACKUP_DOWNLOADS: ${MOSS_BACKUP_DOWNLOADS:-true}
      TZ: ${TZ:-UTC}
    secrets: [backup_token, backup_run_token]
    volumes:
      - ./secrets:/moss/secrets:ro
      - ./.env:/moss/env:ro
      - ./backups:/backups
      - caddy_data:/caddy-data:ro
      - tls:/tls:ro
    networks: [backend]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    cap_add: [DAC_OVERRIDE, CHOWN, FOWNER]
    security_opt: ["no-new-privileges:true"]
    depends_on:
      migrate: { condition: service_completed_successfully }

  # HTTPS in front of the web UI, for every device on your network. MOSS_TLS chooses the certificate:
  #   internal  MOSS's own certificate authority (default): works offline; each device trusts it once by
  #             installing https://<host>/moss-ca.crt. MOSS_HTTPS_HOSTS lists the names and IPs it answers to.
  #   files     your own certificate: deploy/certs/cert.pem (full chain) and key.pem, e.g. from Let's Encrypt
  #             or Tailscale. Restart this service after replacing them.
  https:
    image: moss-https:${MOSS_VERSION:-dev}
    build: { context: .., dockerfile: deploy/docker/https.Dockerfile }
    profiles: [https]
    restart: unless-stopped
    # Root without capabilities, in the web app's group (node, 1000): /tls/web, its files and Caddy's admin socket are
    # shared by the two containers through that group, and closed to everyone else.
    user: "0:1000"
    # /tls/web is shared with the web app (which writes the uploaded certificate, the choice of certificate and the
    # names MOSS answers to); it starts out as "MOSS's own CA", for MOSS_HTTPS_HOSTS.
    command:
      - sh
      - -c
      - mkdir -p /tls/web/sites && chgrp 1000 /tls/web /tls/web/sites && chmod 0770 /tls/web /tls/web/sites && { [ -f /tls/web/tls.caddy ] || echo "tls internal" > /tls/web/tls.caddy; } && { [ -f /tls/web/lan.caddy ] || printf '%s {\n\timport lan_site\n}\n' "$$MOSS_HTTPS_HOSTS" > /tls/web/lan.caddy; } && { [ -f /tls/web/sni.caddy ] || echo "default_sni $$MOSS_HTTPS_DEFAULT_NAME" > /tls/web/sni.caddy; } && exec caddy run --config "/etc/caddy/${MOSS_TLS:-internal}.Caddyfile" --adapter caddyfile
    environment:
      # Only the starting list: after that, Settings → HTTPS → Addresses.
      MOSS_HTTPS_HOSTS: ${MOSS_HTTPS_HOSTS:-localhost}
      # The certificate for clients that connect by IP address (they send no name): usually the LAN IP.
      MOSS_HTTPS_DEFAULT_NAME: ${MOSS_HTTPS_DEFAULT_NAME:-localhost}
    ports:
      - "${MOSS_HTTPS_BIND:-0.0.0.0}:${MOSS_HTTPS_PORT:-443}:8443"
    volumes:
      - ./https:/etc/caddy:ro
      - ./certs:/certs:ro
      - caddy_data:/data
      - caddy_config:/config
      - tls:/tls
    networks: [backend]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    # The caddy binary carries this file capability; without it in the bounding set it won't start.
    cap_add: [NET_BIND_SERVICE]
    security_opt: ["no-new-privileges:true"]
    depends_on: [web]

networks:
  backend: {}
  # Internal: gate <-> toolbox only, no route out.
  tools: { internal: true }
  # Gives the toolbox a route to your network for scanning.
  egress: {}
  # The log collector and the web app.
  syslog: { internal: true }
  # The collector's published syslog port.
  syslog_in: {}

secrets:
  master_key: { file: ./secrets/master.key }
  gate_token: { file: ./secrets/gate.token }
  llm_token: { file: ./secrets/llm.token }
  toolbox_token: { file: ./secrets/toolbox.token }
  web_token: { file: ./secrets/web.token }
  app_key: { file: ./secrets/app.key }
  backup_token: { file: ./secrets/backup.token }
  backup_run_token: { file: ./secrets/backup-run.token }
  bridge_token: { file: ./secrets/bridge.token }
  setup_code: { file: ./secrets/setup.code }
  syslog_token: { file: ./secrets/syslog.token }

volumes:
  pgdata:
  # HTTPS: MOSS's certificate authority and certificates. Back it up with the rest (losing it means every
  # device has to trust a new CA).
  caddy_data:
  caddy_config:
  # A certificate uploaded in Settings → HTTPS, and which certificate Caddy uses.
  tls:
  # The Tailscale sidecar's identity on your tailnet.
  tailscale_state:
